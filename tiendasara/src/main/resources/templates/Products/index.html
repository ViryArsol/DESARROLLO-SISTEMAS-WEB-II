<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda Sara - Productos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body style="background-color: #fce4ec;">

    <!-- Barra de Navegación superior -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #c2185b;">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Tienda Sara - Panel de Administración</a>
      </div>
    </nav>

    <div class="container my-5">
      <h2 class="text-center fw-bold mb-4" style="color: #c2185b;">Lista de Productos</h2>

      <!-- Botón para Crear Producto -->
      <div class="row mb-3">
        <div class="col">
          <a class="btn text-white px-4 rounded-pill shadow-sm fw-bold" style="background-color: #c2185b;" href="/products/create">Create Product</a>
        </div>
      </div>

      <!-- Tabla de Productos -->
      <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
        <div class="table-responsive">
          <table class="table align-middle table-hover">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Price</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Mark</th>
                <th>Image</th>
                <th>Created At</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.description}" class="fw-bold"></td>
                <td th:text="${'$' + product.price}"></td>
                <td th:text="${product.amount}"></td>
                <td th:text="${product.category}"></td>
                <td th:text="${product.mark}"></td>
                <td>
                  <img th:src="@{'/images/' + ${product.imageFileName}}" alt="Imagen" width="50" class="rounded-3 shadow-sm" style="height: 50px; object-fit: cover;">
                </td>
                <td th:text="${product.createdAt}"></td>
                <td>
                  <a class="btn btn-primary btn-sm rounded-pill px-3" th:href="@{'/products/edit?id=' + ${product.id}}">Edit</a>
                  <a class="btn btn-danger btn-sm rounded-pill px-3" th:href="@{'/products/delete?id=' + ${product.id}}" onclick="return confirm('¿Estás seguro de eliminar este producto?');">Delete</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
