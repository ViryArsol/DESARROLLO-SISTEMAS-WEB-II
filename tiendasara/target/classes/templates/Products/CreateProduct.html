<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda Sara - Nuevo Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body style="background-color: #fce4ec;">
    <div class="container my-5">
      <div class="row">
        <div class="col-md-8 offset-md-2 rounded-4 p-4 shadow-sm bg-white">
          <h2 class="text-center fw-bold mb-4" style="color: #c2185b;">New Product</h2>

          <form method="post" enctype="multipart/form-data" th:object="${productDto}">

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-bold">Description</label>
              <div class="col-sm-8">
                <input class="form-control" th:field="*{description}">
                <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger small"></p>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-bold">Amount</label>
              <div class="col-sm-8">
                <input class="form-control" type="number" th:field="*{amount}">
                <p th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" class="text-danger small"></p>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-bold">Category</label>
              <div class="col-sm-8">
                <select class="form-select" th:field="*{category}">
                  <option value="">Selecciona una categoría</option>
                  <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
                <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-danger small"></p>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-bold">Mark</label>
              <div class="col-sm-8">
                <select class="form-select" th:field="*{mark}">
                  <option value="">Selecciona una marca</option>
                  <option th:each="m : ${marks}" th:value="${m.id}" th:text="${m.name}"></option>
                </select>
                <p th:if="${#fields.hasErrors('mark')}" th:errors="*{mark}" class="text-danger small"></p>
              </div>
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label fw-bold">Image</label>
              <div class="col-sm-8">
                <input class="form-control" type="file" th:field="*{imageFile}">
                <p th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}" class="text-danger small"></p>
              </div>
            </div>

            <div class="row pt-3">
              <div class="offset-sm-4 col-sm-4 d-grid">
                <button type="submit" class="btn text-white fw-bold rounded-pill" style="background-color: #c2185b;">Submit</button>
              </div>
              <div class="col-sm-4 d-grid">
                <a class="btn btn-outline-secondary rounded-pill" href="/products" role="button">Cancel</a>
              </div>
            </div>

          </form>
        </div>
      </div>
    </div>
  </body>
</html>
